<!DOCTYPE html>
<html>
<head>
<title>Community Food Share</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Community Food Share Platform</h1>

<form id="foodForm">

<input type="text"
id="donorName"
placeholder="Donor Name"
required>

<input type="text"
id="foodItem"
placeholder="Food Item"
required>

<input type="text"
id="quantity"
placeholder="Quantity"
required>

<input type="text"
id="location"
placeholder="Location"
required>

<input type="text"
id="contact"
placeholder="Contact"
required>

<button type="submit">
Donate Food
</button>

</form>

<h2>Available Donations</h2>

<div id="donationList"></div>

<script src="script.js"></script>

</body>
</html>
